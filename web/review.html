async function batchDelete(){
  const hashes = [...batchSel]; if(!hashes.length) return;
  // 预判受保护（已通过 Approved / 已对账入账）→ 会被跳过；点击时就先告知，不必删完才知道
  const byHash = {}; qItems.forEach(it=>{ byHash[it.file_hash] = it; });
  const protectedN = hashes.filter(h=>{ const it = byHash[h]; return it && (it.approve_status==='Approved' || it.reconciled); }).length;
  const delN = hashes.length - protectedN;
  let msg = '确定删除选中的 ' + hashes.length + ' 条记录？删除不可撤销（会留痕到审计轨迹）。';
  if(protectedN) msg += '\n\n其中 ' + protectedN + ' 条已通过/已对账入账，受保护会被跳过；实际将删除 ' + delN + ' 条。';
  if(delN === 0){ alert('选中的 ' + hashes.length + ' 条全部已通过/已对账入账，受保护、无法删除（如需作废请走红冲或先撤销对账）。'); return; }
  if(!confirm(msg)) return;
  const reason = prompt('删除原因（可选，留痕用）：') || '';
  let ok = 0, fail = 0; const fails = [];
  for(const h of hashes){
    try{
      const r = await fetch('/api/review/' + encodeURIComponent(h) + '/delete', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({by:'reviewer', reason})});
      const d = await r.json();
      if(r.ok && !d.error) ok++; else { fail++; fails.push(h.slice(0,6)); }
    }catch(e){ fail++; fails.push(h.slice(0,6)); }
  }
  batchSel.clear();
  if(cur && hashes.includes(cur.file_hash)){ document.getElementById('detail').innerHTML = '<div class="muted">已删除该记录。</div>'; cur = null; }
  await loadQueue();
  alert('批量删除完成：成功 ' + ok + ' 条'
        + (fail ? ('，跳过/失败 ' + fail + ' 条（多为已通过或已对账受保护）：#' + fails.join(' #')) : ''));
}
async function batchApprove(){
  const hashes = [...batchSel]; if(!hashes.length) return;
  if(!confirm('对选中的 ' + hashes.length + ' 条逐条 Approve？（缺关键字段的会被跳过并汇报）')) return;
  let ok = 0, fail = 0; const fails = [];
  for(const h of hashes){
    try{
      const r = await fetch('/api/review/' + encodeURIComponent(h) + '/action', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'Approved', by:'reviewer'})});
      const d = await r.json();
      if(r.ok && !d.error) ok++; else { fail++; fails.push(h.slice(0,6)); }
    }catch(e){ fail++; fails.push(h.slice(0,6)); }
  }
  batchSel.clear();
  await loadQueue();
  alert('批量通过完成：成功 ' + ok + ' 条'
        + (fail ? ('，失败 ' + fail + ' 条（多为缺关键字段）：#' + fails.join(' #')) : ''));
}
document.addEventListener('keydown', e=>{
  const t = e.target;
  if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;   // 输入时不劫持
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(document.getElementById('regpop')) return;                  // 弹窗打开时不劫持
  switch(e.key){
    case 'j': case 'ArrowDown': e.preventDefault(); moveSel(1); break;
    case 'k': case 'ArrowUp':   e.preventDefault(); moveSel(-1); break;
    case 'a': if(cur){ e.preventDefault(); act('Approved', true); } break;
    case 'r': if(cur){ e.preventDefault(); act('Rejected'); } break;
    case 'h': if(cur){ e.preventDefault(); act('Hold'); } break;
    case '?': e.preventDefault(); alert('快捷键\\nj / ↓  下一条\\nk / ↑  上一条\\na  通过并跳到下一条 (Approve & Post)\\nr  拒绝\\nh  待定\\n?  显示本帮助'); break;
  }
});

// ---- 学到新规则 → 当场弹窗启用（省得每次去「已学规则」页）----
let _learnedEnabledAny = false;
let _LEARNED = [];
function ruleDesc(r){
  if(r.note && r.note.trim()) return esc(r.note).replace(/\n/g,'<br>');  // 人工改写的整段说明优先
  return ruleDescAuto(r);
}
function ruleDescAuto(r){
  const co = esc(r.match_key || '该开票方');
  const t = esc(r.target || ''), v = esc((r.value||'').slice(0,44));
  if(r.rule_type==='classification') return `以后 <b>${co}</b> 的发票，记账科目建议 <b>${esc(r.category||'—')} / ${esc(r.account||'—')}</b>`;
  if(r.rule_type==='content_class') return `内容与「${esc((r.value||'').slice(0,24))}…」相近的发票，科目建议 <b>${esc(r.category||'—')} / ${esc(r.account||'—')}</b>`;
  if(r.rule_type==='field_default') return `以后 <b>${co}</b> 的发票，<b>核对原件后</b>自动把 <b>${t}</b> 填为「${v}」（不盲填）`;
  if(r.rule_type==='field_locator') return `遇到标签「<b>${v}</b>」时，把它旁边的值填进 <b>${t}</b>（现场核对，只补空/没把握的字段）`;
  if(r.rule_type==='line_split') return `以后 <b>${co}</b> 的发票，相似大段明细按此规律拆成多条`;
  if(r.rule_type==='multi_invoice') return `以后<b>同版面</b>的文件，倾向<b>${r.value==='single'?'当作单张·不自动拆':'当作多张·更积极拆'}</b>（仍核对文档，不写死）`;
  return '一条新规则';
}
// 整句可改：句子里每个可变部分都是内联输入框，仍写回结构化字段
function _li(k,v,w){ return `<input data-k="${k}" value="${esc(v==null?'':v)}" style="width:${w||90}px;padding:1px 4px;font-size:13px">`; }
function _lsel(k,v,opts){ return `<select data-k="${k}" style="font-size:13px">${opts.map(o=>`<option value="${o.v}"${v===o.v?' selected':''}>${o.t}</option>`).join('')}</select>`; }
// 把大白话句子渲染成「填空式」可编辑（内联输入框）
function editSentence(r){
  const t=r.rule_type;
  if(t==='classification') return `以后 ${_li('match_key',r.match_key,130)} 的发票，记账科目建议 ${_li('category',r.category,120)} / ${_li('account',r.account,140)}`;
  if(t==='content_class') return `内容与「${_li('value',r.value,200)}」相近的发票，科目建议 ${_li('category',r.category,120)} / ${_li('account',r.account,140)}`;
  if(t==='field_default') return `以后 ${_li('match_key',r.match_key,130)} 的发票，核对原件后自动把 ${_li('target',r.target,110)} 填为「${_li('value',r.value,150)}」`;
  if(t==='field_locator') return `遇到标签「${_li('value',r.value,130)}」时，把它旁边的值填进 ${_li('target',r.target,110)}`;
  if(t==='line_split') return `以后 ${_li('match_key',r.match_key,130)} 的发票，相似大段明细按此规律拆分：${_li('value',r.value,240)}`;
  if(t==='multi_invoice') return `以后同版面的文件，倾向 ${_lsel('value',r.value,[{v:'single',t:'当作单张·不自动拆'},{v:'multi',t:'当作多张·更积极拆'}])}`;
  return _li('value',r.value,240);
}
// 纯文本版自动描述（去掉 <b> 等标签），用于预填 textarea
function _stripTags(html){ const d=document.createElement('div'); d.innerHTML=html; return d.textContent||''; }
function editFormHtml(r,i){
  const noteText = esc((r.note && r.note.trim()) ? r.note : _stripTags(ruleDescAuto(r)));
  return `<div class="ledit" id="ledit${i}" style="display:none;margin:6px 0;padding:8px 10px;background:#f6f8fb;border-radius:6px;line-height:1.8">
      <div style="font-size:12px;color:#64748b;margin-bottom:3px">这段话怎么写都行（随便改），写完点下面的按钮，让系统读懂它：</div>
      <textarea data-k="note" rows="2" style="width:100%;font-size:13px;box-sizing:border-box">${noteText}</textarea>
      <button class="mbtn" style="margin-top:5px" onclick="parseRuleText(${i})">🔍 解析这句话 → 变成规则</button>
      <div id="lparse${i}" style="font-size:12px;margin:5px 0"></div>
      <div style="font-size:12px;color:#64748b;margin:8px 0 3px">系统读懂后填在这里（确认无误、或直接手动改这几处才真正影响识别）：</div>
      <div style="margin-bottom:6px">${editSentence(r)}</div>
      <button class="mbtn" onclick="saveLearnedEdit(${i})">保存修改</button>
      <button class="mbtn" onclick="document.getElementById('ledit${i}').style.display='none'">取消</button>
    </div>`;
}
function promptLearned(learned, reapplyHash){
  if(!learned || !learned.length) return;
  _learnedEnabledAny = false;
  _LEARNED = learned;
  const rows = learned.map((r,i)=>`
    <div class="lrow" id="lrow${i}">
      <div class="ldesc" id="ldesc${i}">${ruleDesc(r)}</div>
      ${editFormHtml(r,i)}
      <div class="lbtns">
        <button class="mbtn" onclick="enableLearned(${r.id},false,${i})">启用${r.can_global?'·仅这家/同版面':''}</button>
        ${r.can_global?`<button class="mbtn" onclick="enableLearned(${r.id},true,${i})">启用·所有发票通用</button>`:''}
        <button class="mbtn" title="识别不准可先改" onclick="var e=document.getElementById('ledit${i}');e.style.display=e.style.display==='none'?'block':'none'">✎ 修改</button>
        <button class="mbtn" onclick="document.getElementById('lrow${i}').classList.add('ldone')">忽略</button>
      </div>
    </div>`).join('');
  const ov = document.createElement('div');
  ov.className='cutoverlay'; ov.id='learnov';
  ov.dataset.reapply = reapplyHash || '';
  ov.innerHTML = `<div class="cutpanel" style="max-width:600px;align-self:center">
    <div class="cutbar"><b>🧠 刚学到 ${learned.length} 条新规则</b>
      <span class="muted" style="margin-left:8px">要现在启用吗？（也可以以后在「已学规则」页处理）</span>
      <span style="flex:1"></span>
      <button class="mbtn cutok" onclick="finishLearned()">完成</button></div>
    <div style="padding:10px 14px;max-height:70vh;overflow:auto">${rows}</div></div>`;
  document.body.appendChild(ov);
}
async function parseRuleText(i){
  const box = document.getElementById('ledit'+i); if(!box) return;
  const ta = box.querySelector('textarea[data-k="note"]');
  const text = ta ? ta.value.trim() : '';
  const st = document.getElementById('lparse'+i);
  if(!text){ st.innerHTML='<span style="color:#b45309">先写点内容再解析</span>'; return; }
  const d = await (await fetch('/api/learned/'+_LEARNED[i].id+'/parse',
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})).json();
  // 把读懂的字段填进下面的空格（note 不回填 textarea）
  Object.keys(d.fields||{}).forEach(k=>{
    if(k==='note') return;
    const el = box.querySelector('[data-k="'+k+'"]:not(textarea)');
    if(el) el.value = d.fields[k];
  });
  let msg = '';
  if((d.understood||[]).length) msg += '<span style="color:#15803d">✅ 读懂：'+d.understood.join('；')+'</span>';
  if((d.missing||[]).length) msg += (msg?'<br>':'')+'<span style="color:#b45309">⚠️ 没读出：'+d.missing.join('、')+'（请手动填下面对应空格）</span>';
  st.innerHTML = msg || '<span style="color:#64748b">没解析到可用要素</span>';
}
async function saveLearnedEdit(i){
  const box = document.getElementById('ledit'+i); if(!box) return;
  const patch = {};
  box.querySelectorAll('[data-k]').forEach(el=>{ patch[el.dataset.k] = el.value.trim(); });
  const r = await fetch('/api/learned/'+_LEARNED[i].id+'/update', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch)});
  const d = await r.json().catch(()=>({}));
  if(!r.ok || !d.updated){ alert('保存失败'); return; }
  Object.assign(_LEARNED[i], patch);                       // 同步本地，重渲染大白话
  document.getElementById('ldesc'+i).innerHTML = ruleDesc(_LEARNED[i]);
  box.style.display='none';
}
async function enableLearned(id, global, i){
  const r = await fetch('/api/learned/'+id+(global?'/enable-global':'/enable'), {method:'POST'});
  if(!r.ok){ alert('启用失败'); return; }
  _learnedEnabledAny = true;
  const row = document.getElementById('lrow'+i);
  if(row){ row.classList.add('ldone'); row.querySelector('.lbtns').innerHTML =
    `<span style="color:#137333;font-size:12px">✓ 已启用${global?'（所有发票通用）':''}</span>`; }
}
async function finishLearned(){
  const ov = document.getElementById('learnov'); if(!ov) return;
  const reapplyHash = ov.dataset.reapply;
  ov.remove();
  if(_learnedEnabledAny && reapplyHash && cur && cur.file_hash===reapplyHash){
    if(confirm('已启用新规则。要按新规则重新提取这张发票吗？（保留你手改/确认过的字段）'))
      await reapplyRules();
  }
}

// 按最新规则重新提取（逐条 / 批量）——从原件重跑，保留人工修改/确认，仅未通过
async function reapplyRules(){
  if(!cur) return;
  const r = await fetch('/api/review/' + encodeURIComponent(cur.file_hash) + '/reapply', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({by:'reviewer'})});
  const d = await r.json();
  if(d.error){ alert('重新提取失败：' + d.error); return; }
  if(!d.applied){ alert(d.reason || '未处理'); return; }
  alert((d.changed && d.changed.length) ? ('已重新提取，变更字段：' + d.changed.join('、') + '（你手改/确认的已保留）') : '已重新提取，无字段变化。');
  selectRecord(cur.file_hash);
}
async function reapplyAll(){
  // 选范围：1=只发票、2=只流水、3=发票+流水
  const pick = prompt('对【未通过】记录从原件重新提取，选择范围：\n\n  1 = 全部发票\n  2 = 全部流水\n  3 = 发票 + 流水（全部）\n\n会吃到最新代码+已启用规则，但保留你手改/确认的字段与明细；已通过的跳过。\n\n请输入 1 / 2 / 3：',
                     DOC_TYPE==='statement'?'2':'1');   // 默认当前所在标签
  if(pick===null) return;
  const map = {'1':'invoice','2':'statement','3':null};
  if(!(pick in map)){ alert('请输入 1、2 或 3。'); return; }
  const doc_type = map[pick];
  const label = doc_type==='invoice'?'全部发票':(doc_type==='statement'?'全部流水':'发票+流水');
  const r = await fetch('/api/review/reapply-all', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({by:'reviewer', doc_type: doc_type})});
  const d = await r.json();
  if(d.error){ alert('重新提取失败：' + d.error); return; }
  await loadQueue();
  if(cur) selectRecord(cur.file_hash);
  alert('批量重新提取完成（'+label+'）：扫描 ' + (d.scanned||0) + ' 条，变更 ' + (d.updated||0) + ' 条。');
}

document.getElementById('filter').addEventListener('change', loadQueue);
// 进入审核页：先恢复"上次在看的类型"（发票/流水），再加载对应队列，最后恢复"上次在看的文件"
(async ()=>{
  const params = new URLSearchParams(location.search);
  const urlFix = params.get('fix');                    // 从对账页「提取纠错」横幅跳来：fix=invoice|statement
  let lastT=null; try{ lastT = localStorage.getItem('review:lastType'); }catch(e){}
  if(urlFix==='statement'){ DOC_TYPE='statement'; syncTypeButtons(); }
  else if(urlFix){ DOC_TYPE='invoice'; syncTypeButtons(); }
  else if(lastT==='statement'){ DOC_TYPE='statement'; syncTypeButtons(); }   // 上次在审流水 → 回到流水标签
  await loadQueue();
  if(urlFix){                                          // 自动落到第一条"需纠错"的记录并高亮滚动
    const first = qItems.find(x=>x.needs_fix);
    if(first){
      await selectRecord(first.file_hash);
      const cell = [...document.querySelectorAll('.qitem')].find(x=>x.dataset.hash===first.file_hash);
      if(cell){ document.querySelectorAll('.qitem').forEach(x=>x.classList.remove('sel')); cell.classList.add('sel'); cell.scrollIntoView({block:'center'}); }
    }
    return;
  }
  const urlH = params.get('hash');
  if(urlH){                                            // 深链最优先（比对/重复跳转、上传页「→人工录入」、流水/余额调节卡片，会自动对齐类型）
    const ok = await selectRecord(urlH);
    const urlTxn = params.get('txn');                  // 上传页「最近识别的流水交易」卡片带来的交易下标 → 定位并闪动该行
    if(ok && urlTxn!=null && urlTxn!==''){
      const ti = parseInt(urlTxn, 10);
      if(!isNaN(ti)) setTimeout(()=>{ try{ focusTxn(ti); }catch(e){} }, 250);   // 待详情渲染/图片布局稳定后再定位
    }
    const urlField = params.get('field');              // 余额调节「未命名账户」等跳来：定位并聚焦该表头字段（如 bank_name 开户行）
    if(ok && urlField){
      setTimeout(()=>{ try{ focusField(urlField); }catch(e){} }, 250);
    }
    return;
  }
  let lastH = null; try{ lastH = localStorage.getItem('review:lastHash'); }catch(e){}
  if(!lastH) return;
  const ok = await selectRecord(lastH, true);          // 静默：文件已删/入账移出也不报错
  if(ok){                                              // 高亮并滚到该队列项（在合集里或已翻页外则仅打开详情）
    const cell = [...document.querySelectorAll('.qitem')].find(x=>x.dataset.hash===lastH);
    if(cell){ cell.classList.add('sel'); cell.scrollIntoView({block:'center'}); }
  } else { try{ localStorage.removeItem('review:lastHash'); }catch(e){} }
})();
</script>
<!-- 审核页：左列表、右审核区各自独立的回到顶部 -->
<button id="toTopList" title="队列列表回到顶部" onclick="__toTopEl('#queue')">↑ 列表</button>
<button id="toTopDetail" title="审核区回到顶部" onclick="__toTopEl('.detail,.orig,.fields')">↑ 审核</button>
<style>
#toTopList,#toTopDetail{position:fixed;bottom:18px;z-index:9999;display:none;padding:9px 13px;border:0;border-radius:22px;background:#1f4e78;color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#toTopList{left:18px}#toTopDetail{right:18px}
#toTopList:hover,#toTopDetail:hover{background:#163a5a}
</style>
<script>
(function(){
  function anyScrolled(sel){var s=document.querySelectorAll(sel);for(var i=0;i<s.length;i++){if(s[i].scrollTop>200)return true;}return false;}
  window.__toTopEl=function(sel){document.querySelectorAll(sel).forEach(function(e){try{e.scrollTo({top:0,behavior:'smooth'});}catch(_){e.scrollTop=0;}});};
  function upd(){
    var bl=document.getElementById('toTopList'), bd=document.getElementById('toTopDetail');
    if(bl)bl.style.display=anyScrolled('#queue')?'block':'none';
    if(bd)bd.style.display=anyScrolled('.detail,.orig,.fields')?'block':'none';
  }
  document.addEventListener('scroll',upd,true);window.addEventListener('resize',upd);setInterval(upd,600);
})();
</script>
